<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Late Page</title>
  </head>
  <body>
    <div id="slot"></div>
    <script>
      // Mimics a single-page app that paints well after domcontentloaded.
      setTimeout(() => {
        const button = document.createElement('button');
        button.textContent = 'Reveal later';
        document.getElementById('slot').appendChild(button);
      }, 900);
    </script>
  </body>
</html>
